apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      imagePullSecrets:
      - name: dockerhub-secret
      containers:
        - name: my-app
          image: mahijs/my-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
